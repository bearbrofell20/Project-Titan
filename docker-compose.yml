# 24/7 deployment: `docker compose up -d` then open http://localhost:8080
#
# Put your secrets in a local `.env` file next to this one (git-ignored):
#   OANDA_API_TOKEN=your-practice-token
#   OANDA_ACCOUNT_ID=101-001-39975042-001
#
# The defaults below are the validation-winning config: ema_trend 20/60 on the
# JPY crosses AUD_JPY + EUR_JPY (H1), signals-only, testing-week probation.
# These two pairs are the only ones with a positive edge across IS/OOS/holdout
# and 6/6 walk-forward windows (see AUDIT.md). Override any of them in .env.
services:
  titan:
    build: .
    restart: unless-stopped          # survives crashes and host reboots
    ports:
      - "8080:8080"                  # dashboard
    environment:
      # --- credentials / account ---
      OANDA_API_TOKEN: "${OANDA_API_TOKEN}"
      OANDA_ACCOUNT_ID: "${OANDA_ACCOUNT_ID:-101-001-39975042-001}"
      OANDA_API_URL: "${OANDA_API_URL:-https://api-fxpractice.oanda.com}"
      OANDA_DRY_RUN: "${OANDA_DRY_RUN:-false}"
      # --- validated strategy config: GOLD breakout (XAU_USD) ---
      # The one config that survives the full hostile audit (project/FINAL_REPORT.md):
      # Donchian breakout on gold H1, positive across IS/VALID/OOS, robust to
      # parameters and costs. Gold pip = 0.1, so stop 200 pips = $20, target = $40.
      OANDA_STRATEGY: "${OANDA_STRATEGY:-breakout}"
      OANDA_INSTRUMENTS: "${OANDA_INSTRUMENTS:-XAU_USD}"
      OANDA_TIMEFRAME: "${OANDA_TIMEFRAME:-H1}"
      OANDA_CANDLE_COUNT: "${OANDA_CANDLE_COUNT:-120}"
      OANDA_BREAKOUT_LOOKBACK: "${OANDA_BREAKOUT_LOOKBACK:-40}"
      OANDA_TREND_FILTER: "${OANDA_TREND_FILTER:-false}"
      # ATR-scaled exits (stop = 1.5xATR, target = 2R) — how the edge was validated
      OANDA_USE_ATR_EXITS: "${OANDA_USE_ATR_EXITS:-true}"
      OANDA_ATR_STOP_MULT: "${OANDA_ATR_STOP_MULT:-1.5}"
      OANDA_ATR_TARGET_MULT: "${OANDA_ATR_TARGET_MULT:-3.0}"
      OANDA_STOP_LOSS_PIPS: "${OANDA_STOP_LOSS_PIPS:-200}"   # fallback if ATR unavailable
      OANDA_TAKE_PROFIT_PIPS: "${OANDA_TAKE_PROFIT_PIPS:-400}"
      # early-exit overrides OFF: let the clean broker stop+target run
      OANDA_PROFIT_TAKE_PCT: "${OANDA_PROFIT_TAKE_PCT:-0}"
      OANDA_LOSS_CUT_PCT: "${OANDA_LOSS_CUT_PCT:-0}"
      OANDA_MIN_OPEN_TRADES: "${OANDA_MIN_OPEN_TRADES:-0}"
      # Gold trades in WHOLE ounces (~$4700 each). With a $20 stop, $100 risk =
      # 5 oz — enough that whole-ounce rounding stays faithful to the backtest.
      # $10 (the old FX value) would round to 0 oz and never trade. ~0.1% of NAV.
      OANDA_RISK_PER_TRADE: "${OANDA_RISK_PER_TRADE:-100}"
      # --- testing-week probation ---
      OANDA_TRIAL_DAYS: "${OANDA_TRIAL_DAYS:-7}"
      OANDA_TRIAL_MIN_PNL: "${OANDA_TRIAL_MIN_PNL:-50}"
      OANDA_TRIAL_MIN_TRADES: "${OANDA_TRIAL_MIN_TRADES:-5}"
    volumes:
      # persists trade logs AND the probation trial file across restarts/reboots
      - ./trade_logs:/data/trade_logs
